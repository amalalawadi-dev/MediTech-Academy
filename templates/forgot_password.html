<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | MediTech Academy</title>
    <link rel="stylesheet"
    href="{{ url_for('static', filename='forgot_password.css') }}">
</head>
<body>
    <div class="container">
        <h1>Forgot Password</h1>
        <p>
            Enter your email address and choose a new password.
        </p>
        <form action="{{ url_for('forgot_password') }}" method="POST">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >
            <label for="new_password">New Password</label>
            <input
                type="password"
                id="new_password"
                name="new_password"
                placeholder="Enter your new password"
                required
            >
            <button type="submit">
                Change Password
            </button>
        </form>
        <a href="{{ url_for('login') }}">
            Back To Login
        </a>
    </div>
</body>
</html>
