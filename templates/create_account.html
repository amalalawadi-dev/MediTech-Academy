<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Create account-MediTech Academy</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Caveat:wght@400..700&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRwTdqFsfoo6jQXm5mGzQQYD4DjcloQsJOJHQ&s">
        <link rel="stylesheet" href="{{ url_for('static', filename='create_account.css') }}">
        <!-- داخل قالب HTML (مثل forgot_password.html) -->
        </head>
    <body>
        <div class="container">
            <h1>Create Your Account</h1>
            <p class="p1">Please fill out the information below to create an account for accessing the MediTech Academy.</p>
            <form action="{{ url_for('create_account') }}" method="post">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
                <label for="role">Role:</label>
                <select id="role" name="role" required>
                    <option value="Select-Role">Select Role</option>
                    <option value="Doctor">Doctor</option>
                    <option value="Student">Student</option>
                    <option value="Biomedical-Engineer">Biomedical Engineer</option>
                    <option value="Instructor">Instructor</option>
                    <option value="Admin">Admin</option>
                </select>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Choose a password" required>
                <label for="confirm-password">Confirm Password:</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required>
                <button type="submit" id="btn">Create Account</button>
            </form>
            <p class="success-message" id="success-message">
                Your account has been created successfully!
            </p>
            <a href="{{ url_for('login') }}">Back To Login</a>
        </div>    
    </body>    
</html>
